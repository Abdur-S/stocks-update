<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruSea Premium Fish Dashboard</title>

    <!-- Social Media Meta Tags -->
    <meta property="og:title" content="TruSea Fish Stocks Update">
    <meta property="og:description" content="Real-time premium inventory control ledger. Updated live from main distribution center.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://img.icons8.com/3d-fluency/180/fish.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="TruSea Fish Stocks Update">
    <meta name="twitter:image" content="https://img.icons8.com/3d-fluency/180/fish.png">

    <!-- Premium Tailwind Stylesheet -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { dark: '#0b0f19', cardDark: '#131c2e', light: '#f4f7fe', cardLight: '#ffffff' }
                    },
                    animation: {
                        'neon-glow': 'neonBg 6s linear infinite',
                    },
                    keyframes: {
                        neonBg: {
                            '0%, 100%': { 'background-position': '0% 50%' },
                            '50%': { 'background-position': '100% 50%' },
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Vector Icons Engine -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- PDF & Capture Engines -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        html { scroll-behavior: smooth; }
        body { font-family: system-ui, -apple-system, sans-serif; transition: background-color 0.25s, color 0.25s; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        
        /* Gemini Neon Border Glow Setup */
        .gemini-glow-container {
            position: relative;
            border-radius: 1rem;
            padding: 2px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899, #10b981, #3b82f6);
            background-size: 400% 400%;
        }
        .gemini-glow-container:focus-within {
            animation: neonBg 4s linear infinite;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
        }
    </style>
</head>
<body class="bg-brand-light text-slate-900 dark:bg-brand-dark dark:text-slate-100 min-h-screen custom-scrollbar">

    <!-- Premium Navigation Menu bar -->
    <nav class="sticky top-0 z-50 backdrop-blur-xl bg-white/70 dark:bg-brand-dark/70 border-b border-slate-200/60 dark:border-slate-800/60 px-4 py-4 transition-all">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <img src="https://img.icons8.com/3d-fluency/94/fish.png" alt="TruSea 3D Logo" class="w-10 h-10 object-contain">
                <span class="text-xl font-black tracking-tight bg-gradient-to-r from-blue-500 to-emerald-400 bg-clip-text text-transparent">TruSea Analytics</span>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 px-3 py-1.5 rounded-full text-xs font-semibold shadow-sm">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    Live Syncing
                </div>
                <button id="themeToggle" class="p-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 hover:scale-105 active:scale-95 transition-all shadow-sm">
                    <i id="themeIcon" data-lucide="moon"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">
        
        <!-- SEARCH & INTERACTIVE FILTER SUITE -->
        <div class="space-y-6">
            <!-- Gemini Neon Effect Search Bar Wrapper -->
            <div class="max-w-2xl mx-auto">
                <div class="gemini-glow-container transition-all duration-300">
                    <div class="flex items-center bg-white dark:bg-slate-900 rounded-[14px] px-4 py-3">
                        <i data-lucide="search" class="text-slate-400 mr-3 w-5 h-5"></i>
                        <input type="text" id="searchInput" placeholder="search fish name and press enter" 
                               class="w-full bg-transparent text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none font-medium text-base">
                    </div>
                </div>
            </div>

            <!-- Main Split Status Tabs (All, In Stock, Sold Out) -->
            <div class="flex justify-center">
                <div class="bg-slate-200/60 dark:bg-slate-900/80 p-1.5 rounded-2xl flex gap-1 border border-slate-300/30">
                    <button id="tabAllStocks" class="px-6 py-2.5 rounded-xl font-bold text-sm transition-all text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200">
                        All
                    </button>
                    <button id="tabInStock" class="px-6 py-2.5 rounded-xl font-bold text-sm transition-all shadow-sm bg-white dark:bg-slate-800 text-blue-600 dark:text-white">
                        In Stock
                    </button>
                    <button id="tabSoldOut" class="px-6 py-2.5 rounded-xl font-bold text-sm transition-all text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200">
                        Sold Out
                    </button>
                </div>
            </div>

            <!-- Horizontal Category Filter Bar -->
            <div class="flex items-center justify-start md:justify-center gap-2 overflow-x-auto custom-scrollbar pb-2">
                <button data-filter="all" class="filter-btn shrink-0 px-4 py-2 rounded-full text-xs font-bold transition-all bg-blue-600 text-white shadow-md shadow-blue-500/10">All Categories</button>
                <button data-filter="premium slices" class="filter-btn shrink-0 px-4 py-2 rounded-full text-xs font-bold transition-all bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 hover:border-slate-300">Premium Slices</button>
                <button data-filter="regular slices" class="filter-btn shrink-0 px-4 py-2 rounded-full text-xs font-bold transition-all bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 hover:border-slate-300">Regular Slices</button>
                <button data-filter="thick slices" class="filter-btn shrink-0 px-4 py-2 rounded-full text-xs font-bold transition-all bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 hover:border-slate-300">Thick Slices</button>
                <button data-filter="cleaned whole fish" class="filter-btn shrink-0 px-4 py-2 rounded-full text-xs font-bold transition-all bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 hover:border-slate-300">Cleaned Whole Fish</button>
                <button data-filter="fillets" class="filter-btn shrink-0 px-4 py-2 rounded-full text-xs font-bold transition-all bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 hover:border-slate-300">Fillets</button>
                <button data-filter="curry cuts" class="filter-btn shrink-0 px-4 py-2 rounded-full text-xs font-bold transition-all bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 hover:border-slate-300">Curry Cuts</button>
                <button data-filter="prawns" class="filter-btn shrink-0 px-4 py-2 rounded-full text-xs font-bold transition-all bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 hover:border-slate-300">Prawns</button>
                <button data-filter="crabs" class="filter-btn shrink-0 px-4 py-2 rounded-full text-xs font-bold transition-all bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 hover:border-slate-300">Crabs</button>
            </div>
        </div>

        <!-- LIVE INVENTORY WRAPPER WITH DROPDOWN EXPORT ENGINE -->
        <section class="space-y-4">
            <div class="flex items-center justify-between flex-wrap gap-3 px-1">
                <span id="renderedHeaderTitle" class="text-base font-black text-slate-800 dark:text-slate-200 tracking-tight">TruSea Live Inventory</span>
                
                <!-- Updated Unified "Download As" Action Button -->
                <div class="relative inline-block text-left">
                    <button id="dropdownToggleBtn" class="inline-flex items-center justify-center gap-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold px-5 py-2.5 rounded-xl transition-all shadow-md text-sm active:scale-95">
                        <i data-lucide="download" class="w-4 h-4"></i> Download As <i data-lucide="chevron-down" class="w-4 h-4"></i>
                    </button>

                    <!-- Target Selection Menu Overlay -->
                    <div id="exportDropdownMenu" class="hidden absolute right-0 mt-2 w-48 rounded-2xl bg-white dark:bg-brand-cardDark border border-slate-200 dark:border-slate-800 shadow-xl z-50 overflow-hidden transform origin-top-right transition-all">
                        <div class="py-1 font-semibold text-xs text-slate-700 dark:text-slate-300 divide-y divide-slate-100 dark:divide-slate-800">
                            <button onclick="runExport('txt')" class="flex items-center gap-3 w-full px-4 py-3 hover:bg-slate-50 dark:hover:bg-slate-900 text-left transition-colors"><i data-lucide="file" class="w-4 h-4 text-amber-500"></i> .txt</button>
                            <button onclick="runExport('pdf')" class="flex items-center gap-3 w-full px-4 py-3 hover:bg-slate-50 dark:hover:bg-slate-900 text-left transition-colors"><i data-lucide="file-text" class="w-4 h-4 text-red-500"></i> .pdf</button>
                            <button onclick="runExport('excel')" class="flex items-center gap-3 w-full px-4 py-3 hover:bg-slate-50 dark:hover:bg-slate-900 text-left transition-colors"><i data-lucide="file-spreadsheet" class="w-4 h-4 text-emerald-500"></i> excel</button>
                            <button onclick="runExport('png')" class="flex items-center gap-3 w-full px-4 py-3 hover:bg-slate-50 dark:hover:bg-slate-900 text-left transition-colors"><i data-lucide="image" class="w-4 h-4 text-blue-500"></i> png image</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Data Table Container Layout -->
            <div id="stockCaptureArea" class="bg-brand-cardLight dark:bg-brand-cardDark rounded-2xl border border-slate-200 dark:border-slate-800/80 shadow-sm overflow-hidden p-1">
                <div class="overflow-x-auto custom-scrollbar">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 dark:bg-slate-900/60 text-slate-400 dark:text-slate-400 text-xs font-bold uppercase tracking-wider border-b border-slate-200 dark:border-slate-800">
                                <th class="p-4 w-12 text-center">Status</th>
                                <th class="p-4">Fish Product Name</th>
                                <th class="p-4 text-right pr-6">Available Stock</th>
                            </tr>
                        </thead>
                        <tbody id="stockListBody" class="divide-y divide-slate-100 dark:divide-slate-800 text-sm">
                            <tr class="animate-pulse"><td class="p-4" colspan="3"><div class="h-5 bg-slate-200 dark:bg-slate-800 rounded"></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbybZ66QUocgWFufPsZOqUYejy_slh32j3hNwGXfG9kfw5_njsgH6ZpAotdIy-Pn58Fj/exec";

        let serverPayload = { stock: [], sales: [] };
        let currentStatusTab = "instock"; 
        let currentCategoryFilter = "all";
        let searchQuery = "";
        let runningStockContext = [];

        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const stockListBody = document.getElementById('stockListBody');
        const searchInput = document.getElementById('searchInput');
        const tabAllStocks = document.getElementById('tabAllStocks');
        const tabInStock = document.getElementById('tabInStock');
        const tabSoldOut = document.getElementById('tabSoldOut');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const dropdownToggleBtn = document.getElementById('dropdownToggleBtn');
        const exportDropdownMenu = document.getElementById('exportDropdownMenu');
        const renderedHeaderTitle = document.getElementById('renderedHeaderTitle');

        dropdownToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            exportDropdownMenu.classList.toggle('hidden');
        });
        document.addEventListener('click', () => exportDropdownMenu.classList.add('hidden'));

        themeToggle.addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.replace('dark', 'light');
                localStorage.setItem('theme', 'light');
                themeIcon.setAttribute('data-lucide', 'moon');
            } else {
                document.documentElement.classList.replace('light', 'dark');
                localStorage.setItem('theme', 'dark');
                themeIcon.setAttribute('data-lucide', 'sun');
            }
            lucide.createIcons();
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                searchQuery = searchInput.value.trim().toLowerCase();
                renderStockMetrics();
            }
        });

        function clearTabStyles() {
            [tabAllStocks, tabInStock, tabSoldOut].forEach(tab => {
                tab.className = "px-6 py-2.5 rounded-xl font-bold text-sm transition-all text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200";
            });
        }

        tabAllStocks.addEventListener('click', () => {
            currentStatusTab = "all";
            clearTabStyles();
            tabAllStocks.className = "px-6 py-2.5 rounded-xl font-bold text-sm transition-all shadow-sm bg-white dark:bg-slate-800 text-indigo-600 dark:text-white";
            renderStockMetrics();
        });

        tabInStock.addEventListener('click', () => {
            currentStatusTab = "instock";
            clearTabStyles();
            tabInStock.className = "px-6 py-2.5 rounded-xl font-bold text-sm transition-all shadow-sm bg-white dark:bg-slate-800 text-blue-600 dark:text-white";
            renderStockMetrics();
        });

        tabSoldOut.addEventListener('click', () => {
            currentStatusTab = "soldout";
            clearTabStyles();
            tabSoldOut.className = "px-6 py-2.5 rounded-xl font-bold text-sm transition-all shadow-sm bg-white dark:bg-slate-800 text-red-500 dark:text-white";
            renderStockMetrics();
        });

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.className = "filter-btn shrink-0 px-4 py-2 rounded-full text-xs font-bold transition-all bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 hover:border-slate-300");
                btn.className = "filter-btn shrink-0 px-4 py-2 rounded-full text-xs font-bold transition-all bg-blue-600 text-white shadow-md shadow-blue-500/10";
                currentCategoryFilter = btn.getAttribute('data-filter');
                renderStockMetrics();
            });
        });

        function getFormattedDateString() {
            const dateObj = new Date();
            const day = dateObj.getDate();
            const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            const monthName = months[dateObj.getMonth()];
            const year = dateObj.getFullYear();
            
            let suffix = "th";
            if (day === 1 || day === 21 || day === 31) suffix = "st";
            else if (day === 2 || day === 22) suffix = "nd";
            else if (day === 3 || day === 23) suffix = "rd";

            return `${day}${suffix} ${monthName} ${year}`;
        }

        async function fetchSpreadsheetContext() {
            try {
                const queryStream = await fetch(API_URL);
                serverPayload = await queryStream.json();
                renderStockMetrics();
            } catch (err) {
                console.error("Connection error with Google Spreadsheet:", err);
            }
        }

        function renderStockMetrics() {
            stockListBody.innerHTML = '';
            const dynamicDate = getFormattedDateString();
            renderedHeaderTitle.innerText = `TruSea Updated Fish Stocks As of ${dynamicDate}`;
            
            runningStockContext = serverPayload.stock.filter(fish => {
                const normalizedName = fish.name.toLowerCase();
                const normalizedStatus = fish.status.toLowerCase();
                const isItemOut = normalizedStatus.includes('out') || fish.kg <= 0;
                
                if (currentStatusTab === "instock" && isItemOut) return false;
                if (currentStatusTab === "soldout" && !isItemOut) return false;
                if (searchQuery && !normalizedName.includes(searchQuery)) return false;
                if (currentCategoryFilter !== "all" && !normalizedName.includes(currentCategoryFilter)) return false;

                return true;
            });

            if(runningStockContext.length === 0) {
                stockListBody.innerHTML = `<tr><td colspan="3" class="p-8 text-center text-slate-400 font-medium">No matching items located.</td></tr>`;
                return;
            }

            runningStockContext.forEach(fish => {
                const isOut = fish.kg <= 0 || fish.status.toLowerCase().includes('out');
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/80 dark:hover:bg-slate-900/40 transition-colors border-b border-slate-100 dark:border-slate-800/50";
                
                tr.innerHTML = `
                    <td class="p-4 text-center">
                        <span class="inline-block h-2.5 w-2.5 rounded-full ${isOut ? 'bg-red-500 shadow-md shadow-red-500/40' : 'bg-emerald-500 shadow-md shadow-emerald-500/40'}"></span>
                    </td>
                    <td class="p-4 font-semibold text-slate-700 dark:text-slate-200 tracking-tight">
                        ${fish.name}
                    </td>
                    <td class="p-4 text-right pr-6 font-mono font-bold ${isOut ? 'text-red-500 uppercase tracking-wide text-xs' : 'text-emerald-500'}">
                        ${isOut ? 'Sold Out' : `${fish.kg.toFixed(2)} kg`}
                    </td>
                `;
                stockListBody.appendChild(tr);
            });
        }

        function runExport(type) {
            const dynamicDate = getFormattedDateString();
            const documentHeading = `TruSea Updated Fish Stocks As of ${dynamicDate}`;
            const fileSaveName = `TruSea_Updated_Fish_Stocks_As_of_${dynamicDate.replace(/ /g, "_")}`;

            if (type === 'excel') {
                let csvContent = `data:text/csv;charset=utf-8,${documentHeading}\n\nFish Variant Name,Current Status,Available Stock (kg)\n`;
                runningStockContext.forEach(fish => {
                    const status = (fish.kg <= 0 || fish.status.toLowerCase().includes('out')) ? "SOLD OUT" : "IN STOCK";
                    csvContent += `"${fish.name}",${status},${fish.kg.toFixed(2)}\n`;
                });
                const link = document.createElement("a");
                link.setAttribute("href", encodeURI(csvContent));
                link.setAttribute("download", `${fileSaveName}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } 
            else if (type === 'pdf') {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                doc.setFont("helvetica", "bold");
                doc.text(documentHeading, 14, 16);
                doc.setFontSize(10);
                doc.setFont("helvetica", "normal");
                doc.text(`Manifest scope: ${currentStatusTab.toUpperCase()} filters`, 14, 23);
                
                let y = 32;
                doc.setFont("helvetica", "bold");
                doc.text("Product Description", 15, y);
                doc.text("Available (kg)", 165, y);
                doc.line(14, y+2, 195, y+2);
                y += 8;

                doc.setFont("helvetica", "normal");
                runningStockContext.forEach(fish => {
                    if (y > 275) { doc.addPage(); y = 20; }
                    const displayWeight = (fish.kg <= 0 || fish.status.toLowerCase().includes('out')) ? "SOLD OUT" : `${fish.kg.toFixed(2)} kg`;
                    doc.text(fish.name, 15, y);
                    doc.text(displayWeight, 165, y);
                    y += 7;
                });
                doc.save(`${fileSaveName}.pdf`);
            } 
            else if (type === 'png') {
                const target = document.getElementById("stockCaptureArea");
                html2canvas(target, { scale: 2, useCORS: true }).then(canvas => {
                    const image = canvas.toDataURL("image/png");
                    const link = document.createElement("a");
                    link.setAttribute("download", `${fileSaveName}.png`);
                    link.setAttribute("href", image);
                    link.click();
                });
            }
            else if (type === 'txt') {
                let txtContent = `${documentHeading}\n`;
                txtContent += "=".repeat(documentHeading.length) + "\n\n";
                runningStockContext.forEach((fish, index) => {
                    const status = (fish.kg <= 0 || fish.status.toLowerCase().includes('out')) ? "SOLD OUT" : `${fish.kg.toFixed(2)} kg Available`;
                    txtContent += `${index + 1}. ${fish.name.padEnd(50)} : ${status}\n`;
                });
                const blob = new Blob([txtContent], { type: "text/plain;charset=utf-8" });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.setAttribute("download", `${fileSaveName}.txt`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'dark') {
                document.documentElement.classList.replace('light', 'dark');
                themeIcon.setAttribute('data-lucide', 'sun');
            } else {
                document.documentElement.classList.replace('dark', 'light');
                themeIcon.setAttribute('data-lucide', 'moon');
            }
            lucide.createIcons();
            fetchSpreadsheetContext();
            setInterval(fetchSpreadsheetContext, 25000);
        });
    </script>
</body>
</html>
