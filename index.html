<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Primary Page Title -->
    <title>TruSea Stocks Update</title>
    <meta name="title" content="TruSea Stocks Update">
    <meta name="description" content="Live Seafood Stock Levels, Rates & Availability">

    <!-- 3D Icon Assets for Browser Tabs & Favicon -->
    <link rel="icon" type="image/png" sizes="96x96" href="https://img.icons8.com/3d-fluency/94/fish.png">
    <link rel="shortcut icon" type="image/png" href="https://img.icons8.com/3d-fluency/94/fish.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://img.icons8.com/3d-fluency/180/fish.png">
    <meta name="theme-color" content="#2563eb">

    <!-- Open Graph / Social Media Meta Tags (WhatsApp, Insta, Facebook, Telegram, X) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="TruSea Stocks Update">
    <meta property="og:title" content="🐟 Live Seafood Stock Levels">
    <meta property="og:description" content="Fresh seafood inventory updated in real time.">
    <meta property="og:image" content="https://img.icons8.com/3d-fluency/180/fish.png">
    <meta property="og:image:width" content="180">
    <meta property="og:image:height" content="180">

    <!-- Twitter / X Meta Tags -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="TruSea Stocks Update">
    <meta name="twitter:description" content="Live Seafood Inventory & Rate Sheet.">
    <meta name="twitter:image" content="https://img.icons8.com/3d-fluency/180/fish.png">

    <!-- Premium Tailwind CSS Framework -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 
                            dark: '#080c14', 
                            cardDark: '#111827', 
                            light: '#f8fafc', 
                            cardLight: '#ffffff',
                            accent: '#2563eb'
                        }
                    },
                    animation: {
                        'neon-glow': 'neonBg 5s linear infinite',
                    },
                    keyframes: {
                        neonBg: {
                            '0%, 100%': { 'background-position': '0% 50%' },
                            '50%': { 'background-position': '100% 50%' },
                        }
                    }
                }
            }
        }
    </script>
    <!-- Vector Icons Engine -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- PDF & Capture Utilities -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        
        .custom-scrollbar::-webkit-scrollbar { height: 4px; width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Gemini Neon Border Glow Effect */
        .gemini-glow-container {
            position: relative;
            border-radius: 1.25rem;
            padding: 2px;
            background: linear-gradient(90deg, #2563eb, #7c3aed, #db2777, #059669, #2563eb);
            background-size: 300% 300%;
            transition: all 0.3s ease;
        }
        .gemini-glow-container:focus-within {
            animation: neonBg 4s linear infinite;
            box-shadow: 0 0 25px rgba(37, 99, 235, 0.25);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-brand-dark dark:text-slate-100 min-h-screen custom-scrollbar transition-colors duration-200">

    <!-- Premium Sticky Header with Full "TruSea Stocks Update" Title -->
    <nav class="sticky top-0 z-50 backdrop-blur-md bg-white/85 dark:bg-brand-dark/85 border-b border-slate-200/80 dark:border-slate-800/80 px-3 sm:px-6 py-3.5 transition-all">
        <div class="max-w-6xl mx-auto flex justify-between items-center gap-2">
            
            <!-- Brand & 3D Logo Header -->
            <div class="flex items-center gap-2 sm:gap-3">
                <img src="https://img.icons8.com/3d-fluency/94/fish.png" alt="TruSea 3D Logo" class="w-8 h-8 sm:w-10 sm:h-10 object-contain drop-shadow-sm shrink-0">
                <h1 class="text-base sm:text-xl font-black tracking-tight bg-gradient-to-r from-blue-600 via-indigo-600 to-emerald-500 bg-clip-text text-transparent whitespace-nowrap">
                    TruSea Stocks Update
                </h1>
            </div>
            
            <!-- Live Sync Status & Theme Switcher -->
            <div class="flex items-center gap-2 sm:gap-3">
                <div class="flex items-center gap-1.5 sm:gap-2 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800/60 px-2 sm:px-3 py-1 sm:py-1.5 rounded-full text-[10px] sm:text-xs font-semibold text-emerald-700 dark:text-emerald-400 shrink-0">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    <span id="syncStatusText" class="whitespace-nowrap">Live Sync</span>
                </div>
                
                <button id="themeToggle" aria-label="Toggle Mode" class="p-1.5 sm:p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:scale-105 active:scale-95 transition-all shrink-0">
                    <i id="themeIcon" data-lucide="moon" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Application Container -->
    <main class="max-w-6xl mx-auto px-3 sm:px-6 py-6 space-y-6">
        
        <!-- SEARCH & FILTER INTERACTION SUITE -->
        <div class="space-y-5">
            
            <!-- Search Bar with Mobile Action Button -->
            <form id="searchForm" onsubmit="executeSearch(event)" class="max-w-2xl mx-auto">
                <div class="gemini-glow-container shadow-sm">
                    <div class="flex items-center bg-white dark:bg-slate-900 rounded-[18px] px-3.5 py-2 sm:py-2.5">
                        <i data-lucide="search" class="text-slate-400 mr-2.5 w-5 h-5 shrink-0"></i>
                        
                        <input type="text" id="searchInput" placeholder="Search fish name..." 
                               class="w-full bg-transparent text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none font-medium text-sm sm:text-base py-1">
                        
                        <!-- Clear Button -->
                        <button type="button" id="clearSearchBtn" onclick="clearSearch()" class="hidden p-1 mr-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                            <i data-lucide="x" class="w-4 h-4"></i>
                        </button>
                        
                        <!-- Mobile-Friendly Explicit Search Button -->
                        <button type="submit" class="bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold text-xs sm:text-sm px-3.5 py-2 rounded-xl transition-all shrink-0 flex items-center gap-1 shadow-md shadow-blue-500/20">
                            <span>Search</span>
                        </button>
                    </div>
                </div>
            </form>

            <!-- Status Split Tabs (All, In Stock, Sold Out, Fish Offers) -->
            <div class="flex justify-center">
                <div class="bg-slate-200/70 dark:bg-slate-900/90 p-1 rounded-2xl flex gap-1 border border-slate-300/40 dark:border-slate-800 overflow-x-auto no-scrollbar max-w-full">
                    <button id="tabAllStocks" class="px-4 sm:px-6 py-2 rounded-xl font-bold text-xs sm:text-sm transition-all text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 whitespace-nowrap">
                        All
                    </button>
                    <button id="tabInStock" class="px-4 sm:px-6 py-2 rounded-xl font-bold text-xs sm:text-sm transition-all shadow-sm bg-white dark:bg-slate-800 text-blue-600 dark:text-white whitespace-nowrap">
                        In Stock
                    </button>
                    <button id="tabSoldOut" class="px-4 sm:px-6 py-2 rounded-xl font-bold text-xs sm:text-sm transition-all text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 whitespace-nowrap">
                        Sold Out
                    </button>
                    <button id="tabFishOffers" class="px-4 sm:px-6 py-2 rounded-xl font-bold text-xs sm:text-sm transition-all text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 whitespace-nowrap">
                        Fishes for Offers
                    </button>
                </div>
            </div>

            <!-- Category Pills Bar -->
            <div class="flex items-center gap-1.5 sm:gap-2 overflow-x-auto no-scrollbar py-1 px-1">
                <button data-filter="all" class="filter-btn shrink-0 px-3.5 py-1.5 rounded-full text-xs font-bold transition-all bg-blue-600 text-white shadow-md shadow-blue-500/15">All Categories</button>
                <button data-filter="premium slices" class="filter-btn shrink-0 px-3.5 py-1.5 rounded-full text-xs font-bold transition-all bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 hover:border-slate-300">Premium Slices</button>
                <button data-filter="regular slices" class="filter-btn shrink-0 px-3.5 py-1.5 rounded-full text-xs font-bold transition-all bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 hover:border-slate-300">Regular Slices</button>
                <button data-filter="thick slices" class="filter-btn shrink-0 px-3.5 py-1.5 rounded-full text-xs font-bold transition-all bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 hover:border-slate-300">Thick Slices</button>
                <button data-filter="cleaned whole fish" class="filter-btn shrink-0 px-3.5 py-1.5 rounded-full text-xs font-bold transition-all bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 hover:border-slate-300">Cleaned Whole Fish</button>
                <button data-filter="fillets" class="filter-btn shrink-0 px-3.5 py-1.5 rounded-full text-xs font-bold transition-all bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 hover:border-slate-300">Fillets</button>
                <button data-filter="curry cuts" class="filter-btn shrink-0 px-3.5 py-1.5 rounded-full text-xs font-bold transition-all bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 hover:border-slate-300">Curry Cuts</button>
                <button data-filter="cubes" class="filter-btn shrink-0 px-3.5 py-1.5 rounded-full text-xs font-bold transition-all bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 hover:border-slate-300">Cubes</button>
                <button data-filter="prawns" class="filter-btn shrink-0 px-3.5 py-1.5 rounded-full text-xs font-bold transition-all bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 hover:border-slate-300">Prawns</button>
                <button data-filter="crabs" class="filter-btn shrink-0 px-3.5 py-1.5 rounded-full text-xs font-bold transition-all bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 hover:border-slate-300">Crabs</button>
            </div>
        </div>

        <!-- LIVE INVENTORY SECTION -->
        <section id="inventorySection" class="space-y-3.5">
            
            <!-- Table Header Bar & Download Dropdown -->
            <div class="flex items-center justify-between flex-wrap gap-2 px-1">
                <div>
                    <h2 id="renderedHeaderTitle" class="text-sm sm:text-base font-extrabold text-slate-800 dark:text-slate-100 tracking-tight">TruSea Updated Fish Stocks</h2>
                    <p id="itemCountSubtext" class="text-[11px] text-slate-400 dark:text-slate-500 font-medium">Fetching stock list...</p>
                </div>
                
                <!-- "Download As" Menu Button -->
                <div class="relative inline-block text-left">
                    <button id="dropdownToggleBtn" class="inline-flex items-center justify-center gap-1.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold px-4 py-2 rounded-xl transition-all shadow-md shadow-blue-500/15 text-xs sm:text-sm active:scale-95">
                        <i data-lucide="download" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i> Download As <i data-lucide="chevron-down" class="w-3.5 h-3.5"></i>
                    </button>

                    <!-- Target Export Menu -->
                    <div id="exportDropdownMenu" class="hidden absolute right-0 mt-2 w-44 rounded-2xl bg-white dark:bg-brand-cardDark border border-slate-200 dark:border-slate-800 shadow-xl z-50 overflow-hidden transform origin-top-right transition-all">
                        <div class="py-1 font-semibold text-xs text-slate-700 dark:text-slate-300 divide-y divide-slate-100 dark:divide-slate-800">
                            <button onclick="runExport('txt')" class="flex items-center gap-2.5 w-full px-4 py-2.5 hover:bg-slate-50 dark:hover:bg-slate-900 text-left transition-colors"><i data-lucide="file" class="w-4 h-4 text-amber-500"></i> .txt File</button>
                            <button onclick="runExport('pdf')" class="flex items-center gap-2.5 w-full px-4 py-2.5 hover:bg-slate-50 dark:hover:bg-slate-900 text-left transition-colors"><i data-lucide="file-text" class="w-4 h-4 text-red-500"></i> .pdf Document</button>
                            <button onclick="runExport('excel')" class="flex items-center gap-2.5 w-full px-4 py-2.5 hover:bg-slate-50 dark:hover:bg-slate-900 text-left transition-colors"><i data-lucide="file-spreadsheet" class="w-4 h-4 text-emerald-500"></i> Excel (.csv)</button>
                            <button onclick="runExport('png')" class="flex items-center gap-2.5 w-full px-4 py-2.5 hover:bg-slate-50 dark:hover:bg-slate-900 text-left transition-colors"><i data-lucide="image" class="w-4 h-4 text-blue-500"></i> PNG Image</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Responsive Clean Stock Table -->
            <div id="stockCaptureArea" class="bg-white dark:bg-brand-cardDark rounded-2xl border border-slate-200/90 dark:border-slate-800/90 shadow-sm overflow-hidden">
                <div class="overflow-x-auto custom-scrollbar">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50/90 dark:bg-slate-900/80 text-slate-400 dark:text-slate-400 text-[11px] font-extrabold uppercase tracking-wider border-b border-slate-200/80 dark:border-slate-800">
                                <th class="py-3 px-3 w-10 text-center">Status</th>
                                <th class="py-3 px-3 sm:px-4">Fish Product Name</th>
                                <th class="py-3 px-2 sm:px-4 text-center w-28 sm:w-36">Rate / kg</th>
                                <th class="py-3 px-3 sm:px-6 text-right w-28 sm:w-36">Available</th>
                            </tr>
                        </thead>
                        <tbody id="stockListBody" class="divide-y divide-slate-100 dark:divide-slate-800/60 text-xs sm:text-sm">
                            <tr class="animate-pulse">
                                <td class="p-4 text-center" colspan="4">
                                    <div class="flex items-center justify-center gap-2 text-slate-400 py-4">
                                        <i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i>
                                        <span class="font-medium">Connecting to TruSea Live Inventory...</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script>
        // GOOGLE APPS SCRIPT API ENDPOINT
        const API_URL = "https://script.google.com/macros/s/AKfycbxO53P6cNhu3OeI5mumee8-DfRk7o1AZ1cbYM-7DZ87bBTJww-7nWx9dNcOqmElBXYB/exec";

        let serverPayload = { stock: [] };
        let currentStatusTab = "instock"; 
        let currentCategoryFilter = "all";
        let searchQuery = "";
        let runningStockContext = [];

        // Element Handles
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const stockListBody = document.getElementById('stockListBody');
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const tabAllStocks = document.getElementById('tabAllStocks');
        const tabInStock = document.getElementById('tabInStock');
        const tabSoldOut = document.getElementById('tabSoldOut');
        const tabFishOffers = document.getElementById('tabFishOffers');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const dropdownToggleBtn = document.getElementById('dropdownToggleBtn');
        const exportDropdownMenu = document.getElementById('exportDropdownMenu');
        const renderedHeaderTitle = document.getElementById('renderedHeaderTitle');
        const itemCountSubtext = document.getElementById('itemCountSubtext');
        const syncStatusText = document.getElementById('syncStatusText');

        // Toggle Export Dropdown
        dropdownToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            exportDropdownMenu.classList.toggle('hidden');
        });
        document.addEventListener('click', () => exportDropdownMenu.classList.add('hidden'));

        // Theme Engine
        themeToggle.addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.replace('dark', 'light');
                localStorage.setItem('theme', 'light');
                themeIcon.setAttribute('data-lucide', 'moon');
            } else {
                document.documentElement.classList.replace('light', 'dark');
                localStorage.setItem('theme', 'dark');
                themeIcon.setAttribute('data-lucide', 'sun');
            }
            lucide.createIcons();
        });

        // Search Input Handlers
        searchInput.addEventListener('input', () => {
            const val = searchInput.value.trim();
            clearSearchBtn.classList.toggle('hidden', val === "");
            searchQuery = val.toLowerCase();
            renderStockMetrics();
        });

        function clearSearch() {
            searchInput.value = "";
            searchQuery = "";
            clearSearchBtn.classList.add('hidden');
            renderStockMetrics();
        }

        // Mobile Form Search Execution
        function executeSearch(e) {
            e.preventDefault();
            searchQuery = searchInput.value.trim().toLowerCase();
            renderStockMetrics();
            
            if (document.activeElement) {
                document.activeElement.blur();
            }

            const targetSection = document.getElementById('inventorySection');
            if (targetSection) {
                targetSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        // Tab Switching Logic
        function clearTabStyles() {
            [tabAllStocks, tabInStock, tabSoldOut, tabFishOffers].forEach(tab => {
                tab.className = "px-4 sm:px-6 py-2 rounded-xl font-bold text-xs sm:text-sm transition-all text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 whitespace-nowrap";
            });
        }

        tabAllStocks.addEventListener('click', () => {
            currentStatusTab = "all";
            clearTabStyles();
            tabAllStocks.className = "px-4 sm:px-6 py-2 rounded-xl font-bold text-xs sm:text-sm transition-all shadow-sm bg-white dark:bg-slate-800 text-indigo-600 dark:text-white whitespace-nowrap";
            renderStockMetrics();
        });

        tabInStock.addEventListener('click', () => {
            currentStatusTab = "instock";
            clearTabStyles();
            tabInStock.className = "px-4 sm:px-6 py-2 rounded-xl font-bold text-xs sm:text-sm transition-all shadow-sm bg-white dark:bg-slate-800 text-blue-600 dark:text-white whitespace-nowrap";
            renderStockMetrics();
        });

        tabSoldOut.addEventListener('click', () => {
            currentStatusTab = "soldout";
            clearTabStyles();
            tabSoldOut.className = "px-4 sm:px-6 py-2 rounded-xl font-bold text-xs sm:text-sm transition-all shadow-sm bg-white dark:bg-slate-800 text-red-500 dark:text-white whitespace-nowrap";
            renderStockMetrics();
        });

        tabFishOffers.addEventListener('click', () => {
            currentStatusTab = "offers";
            clearTabStyles();
            tabFishOffers.className = "px-4 sm:px-6 py-2 rounded-xl font-bold text-xs sm:text-sm transition-all shadow-sm bg-white dark:bg-slate-800 text-amber-500 dark:text-white whitespace-nowrap";
            renderStockMetrics();
        });

        // Category Filter Pills Handler
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.className = "filter-btn shrink-0 px-3.5 py-1.5 rounded-full text-xs font-bold transition-all bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 hover:border-slate-300");
                btn.className = "filter-btn shrink-0 px-3.5 py-1.5 rounded-full text-xs font-bold transition-all bg-blue-600 text-white shadow-md shadow-blue-500/15";
                currentCategoryFilter = btn.getAttribute('data-filter');
                renderStockMetrics();
            });
        });

        // Dynamic Date Formatter
        function getFormattedDateString() {
            const dateObj = new Date();
            const day = dateObj.getDate();
            const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            const monthName = months[dateObj.getMonth()];
            const year = dateObj.getFullYear();
            
            let suffix = "th";
            if (day === 1 || day === 21 || day === 31) suffix = "st";
            else if (day === 2 || day === 22) suffix = "nd";
            else if (day === 3 || day === 23) suffix = "rd";

            return `${day}${suffix} ${monthName} ${year}`;
        }

        // Fetch Live Context Engine
        async function fetchSpreadsheetContext() {
            try {
                const queryStream = await fetch(API_URL);
                const freshData = await queryStream.json();
                
                if (freshData && freshData.stock) {
                    serverPayload = freshData;
                    syncStatusText.innerText = "Synced Just Now";
                    renderStockMetrics();
                }
            } catch (err) {
                console.error("Live fetch error from Google Spreadsheet:", err);
                syncStatusText.innerText = "Live Syncing...";
            }
        }

        // Render Table Rows
        function renderStockMetrics() {
            stockListBody.innerHTML = '';
            const dynamicDate = getFormattedDateString();
            renderedHeaderTitle.innerText = `TruSea Updated Fish Stocks As of ${dynamicDate}`;
            
            runningStockContext = (serverPayload.stock || []).filter(fish => {
                const normalizedName = fish.name.toLowerCase();
                const normalizedStatus = fish.status.toLowerCase();
                const isItemOut = normalizedStatus.includes('out') || fish.kg <= 0;
                const isOfferItem = fish.isOffer || fish.sheet === "Old Stocks" || fish.category === "Old Stocks" || normalizedStatus.includes('offer');
                
                if (currentStatusTab === "instock" && isItemOut) return false;
                if (currentStatusTab === "soldout" && !isItemOut) return false;
                if (currentStatusTab === "offers" && !isOfferItem) return false;
                if (searchQuery && !normalizedName.includes(searchQuery)) return false;
                if (currentCategoryFilter !== "all" && !normalizedName.includes(currentCategoryFilter)) return false;

                return true;
            });

            itemCountSubtext.innerText = `Showing ${runningStockContext.length} item(s) in menu`;

            if(runningStockContext.length === 0) {
                stockListBody.innerHTML = `
                    <tr>
                        <td colspan="4" class="py-10 px-4 text-center text-slate-400 dark:text-slate-500 font-medium">
                            <i data-lucide="package-x" class="w-8 h-8 mx-auto mb-2 opacity-60"></i>
                            No matching fish items found for this selection.
                        </td>
                    </tr>`;
                lucide.createIcons();
                return;
            }

            runningStockContext.forEach(fish => {
                const isOut = fish.kg <= 0 || fish.status.toLowerCase().includes('out');
                const priceFormatted = fish.price && fish.price > 0 ? `₹${fish.price.toLocaleString('en-IN')}` : '-';
                
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/80 dark:hover:bg-slate-900/40 transition-colors border-b border-slate-100 dark:border-slate-800/60";
                
                tr.innerHTML = `
                    <td class="py-3 px-3 text-center">
                        <span class="inline-block h-2.5 w-2.5 rounded-full ${isOut ? 'bg-red-500 shadow-sm shadow-red-500/50' : 'bg-emerald-500 shadow-sm shadow-emerald-500/50'}"></span>
                    </td>
                    <td class="py-3 px-3 sm:px-4 font-bold text-slate-800 dark:text-slate-100 leading-snug">
                        ${fish.name}
                    </td>
                    <td class="py-3 px-2 sm:px-4 text-center font-bold">
                        <span class="inline-block bg-blue-50 dark:bg-blue-950/50 text-blue-700 dark:text-blue-300 px-2 sm:px-2.5 py-1 rounded-md border border-blue-200/60 dark:border-blue-800/60 text-[11px] sm:text-xs font-mono">
                            ${priceFormatted} <span class="text-[9px] opacity-70">/kg</span>
                        </span>
                    </td>
                    <td class="py-3 px-3 sm:px-6 text-right font-mono font-bold ${isOut ? 'text-red-500 uppercase tracking-wide text-[11px] sm:text-xs' : 'text-emerald-600 dark:text-emerald-400'}">
                        ${isOut ? 'Sold Out' : `${fish.kg.toFixed(2)} kg`}
                    </td>
                `;
                stockListBody.appendChild(tr);
            });
            lucide.createIcons();
        }

        // Export Controller
        function runExport(type) {
            const dynamicDate = getFormattedDateString();
            const documentHeading = `TruSea Updated Fish Stocks As of ${dynamicDate}`;
            const fileSaveName = `TruSea_Updated_Fish_Stocks_As_of_${dynamicDate.replace(/ /g, "_")}`;

            if (type === 'excel') {
                let csvContent = `data:text/csv;charset=utf-8,${documentHeading}\n\nFish Variant Name,Current Status,Rate per kg (₹),Available Stock (kg)\n`;
                runningStockContext.forEach(fish => {
                    const status = (fish.kg <= 0 || fish.status.toLowerCase().includes('out')) ? "SOLD OUT" : "IN STOCK";
                    const priceVal = fish.price ? fish.price : 0;
                    csvContent += `"${fish.name}",${status},${priceVal},${fish.kg.toFixed(2)}\n`;
                });
                const link = document.createElement("a");
                link.setAttribute("href", encodeURI(csvContent));
                link.setAttribute("download", `${fileSaveName}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } 
            else if (type === 'pdf') {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                doc.setFont("helvetica", "bold");
                doc.text(documentHeading, 14, 16);
                doc.setFontSize(10);
                doc.setFont("helvetica", "normal");
                doc.text(`Manifest Scope: ${currentStatusTab.toUpperCase()} filters`, 14, 23);
                
                let y = 32;
                doc.setFont("helvetica", "bold");
                doc.text("Product Description", 15, y);
                doc.text("Rate / kg", 125, y);
                doc.text("Available (kg)", 165, y);
                doc.line(14, y+2, 195, y+2);
                y += 8;

                doc.setFont("helvetica", "normal");
                runningStockContext.forEach(fish => {
                    if (y > 275) { doc.addPage(); y = 20; }
                    const displayWeight = (fish.kg <= 0 || fish.status.toLowerCase().includes('out')) ? "SOLD OUT" : `${fish.kg.toFixed(2)} kg`;
                    const displayPrice = fish.price ? `Rs. ${fish.price}` : "-";
                    doc.text(fish.name, 15, y);
                    doc.text(displayPrice, 125, y);
                    doc.text(displayWeight, 165, y);
                    y += 7;
                });
                doc.save(`${fileSaveName}.pdf`);
            } 
            else if (type === 'png') {
                const target = document.getElementById("stockCaptureArea");
                html2canvas(target, { scale: 2, useCORS: true }).then(canvas => {
                    const image = canvas.toDataURL("image/png");
                    const link = document.createElement("a");
                    link.setAttribute("download", `${fileSaveName}.png`);
                    link.setAttribute("href", image);
                    link.click();
                });
            }
            else if (type === 'txt') {
                let txtContent = `${documentHeading}\n`;
                txtContent += "=".repeat(documentHeading.length) + "\n\n";
                runningStockContext.forEach((fish, index) => {
                    const status = (fish.kg <= 0 || fish.status.toLowerCase().includes('out')) ? "SOLD OUT" : `${fish.kg.toFixed(2)} kg Available`;
                    const priceVal = fish.price ? `₹${fish.price}/kg` : "-/kg";
                    txtContent += `${index + 1}. ${fish.name.padEnd(45)} : ${priceVal.padEnd(12)} | ${status}\n`;
                });
                const blob = new Blob([txtContent], { type: "text/plain;charset=utf-8" });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.setAttribute("download", `${fileSaveName}.txt`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }

        // Initialize and Schedule Polling
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'dark') {
                document.documentElement.classList.replace('light', 'dark');
                themeIcon.setAttribute('data-lucide', 'sun');
            } else {
                document.documentElement.classList.replace('dark', 'light');
                themeIcon.setAttribute('data-lucide', 'moon');
            }
            lucide.createIcons();
            
            fetchSpreadsheetContext();
            setInterval(fetchSpreadsheetContext, 10000);
        });
    </script>
</body>
</html>
