<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruSea Premium Fish Dashboard</title>
    <!-- Premium Tailwind Stylesheet -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { dark: '#0b0f19', cardDark: '#131c2e', light: '#f4f7fe', cardLight: '#ffffff' }
                    },
                    animation: {
                        'neon-glow': 'neonBg 6s linear infinite',
                    },
                    keyframes: {
                        neonBg: {
                            '0%, 100%': { 'background-position': '0% 50%' },
                            '50%': { 'background-position': '100% 50%' },
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Vector Icons Engine -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        html { scroll-behavior: smooth; }
        body { font-family: system-ui, -apple-system, sans-serif; transition: background-color 0.25s, color 0.25s; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        
        /* Gemini Neon Border Glow Setup */
        .gemini-glow-container {
            position: relative;
            border-radius: 1rem;
            padding: 2px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899, #10b981, #3b82f6);
            background-size: 400% 400%;
        }
        .gemini-glow-container:focus-within {
            animation: neonBg 4s linear infinite;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
        }
    </style>
</head>
<body class="bg-brand-light text-slate-900 dark:bg-brand-dark dark:text-slate-100 min-h-screen custom-scrollbar">

    <!-- Premium Navigation Menu bar -->
    <nav class="sticky top-0 z-50 backdrop-blur-xl bg-white/70 dark:bg-brand-dark/70 border-b border-slate-200/60 dark:border-slate-800/60 px-4 py-4 transition-all">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2.5 rounded-xl text-white shadow-lg shadow-blue-500/30">
                    <i data-lucide="ship"></i>
                </div>
                <span class="text-xl font-black tracking-tight bg-gradient-to-r from-blue-500 to-emerald-400 bg-clip-text text-transparent">TruSea Analytics</span>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 px-3 py-1.5 rounded-full text-xs font-semibold shadow-sm">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    Live Syncing
                </div>
                <button id="themeToggle" class="p-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 hover:scale-105 active:scale-95 transition-all shadow-sm">
                    <i id="themeIcon" data-lucide="moon"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">
        
        <!-- SEARCH & INTERACTIVE FILTER SUITE -->
        <div class="space-y-6">
            <!-- Gemini Neon Effect Search Bar Wrapper -->
            <div class="max-w-2xl mx-auto">
                <div class="gemini-glow-container transition-all duration-300">
                    <div class="flex items-center bg-white dark:bg-slate-900 rounded-[14px] px-4 py-3">
                        <i data-lucide="search" class="text-slate-400 mr-3 w-5 h-5"></i>
                        <input type="text" id="searchInput" placeholder="search fish name and press enter" 
                               class="w-full bg-transparent text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none font-medium text-base">
                    </div>
                </div>
            </div>

            <!-- Main Split Status Tabs (In Stock vs Sold Out) -->
            <div class="flex justify-center">
                <div class="bg-slate-200/60 dark:bg-slate-900/80 p-1.5 rounded-2xl flex gap-1 border border-slate-300/30">
                    <button id="tabInStock" class="px-6 py-2.5 rounded-xl font-bold text-sm transition-all shadow-sm bg-white dark:bg-slate-800 text-blue-600 dark:text-white">
                        In Stock
                    </button>
                    <button id="tabSoldOut" class="px-6 py-2.5 rounded-xl font-bold text-sm transition-all text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200">
                        Sold Out
                    </button>
                </div>
            </div>

            <!-- Horizontal Category Filter Bar -->
            <div class="flex items-center justify-start md:justify-center gap-2 overflow-x-auto custom-scrollbar pb-2">
                <button data-filter="all" class="filter-btn shrink-0 px-4 py-2 rounded-full text-xs font-bold transition-all bg-blue-600 text-white shadow-md shadow-blue-500/10">All</button>
                <button data-filter="premium slices" class="filter-btn shrink-0 px-4 py-2 rounded-full text-xs font-bold transition-all bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 hover:border-slate-300">Premium Slices</button>
                <button data-filter="regular slices" class="filter-btn shrink-0 px-4 py-2 rounded-full text-xs font-bold transition-all bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 hover:border-slate-300">Regular Slices</button>
                <button data-filter="thick slices" class="filter-btn shrink-0 px-4 py-2 rounded-full text-xs font-bold transition-all bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 hover:border-slate-300">Thick Slices</button>
                <button data-filter="cleaned whole fish" class="filter-btn shrink-0 px-4 py-2 rounded-full text-xs font-bold transition-all bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 hover:border-slate-300">Cleaned Whole Fish</button>
                <button data-filter="fillets" class="filter-btn shrink-0 px-4 py-2 rounded-full text-xs font-bold transition-all bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 hover:border-slate-300">Fillets</button>
                <button data-filter="curry cuts" class="filter-btn shrink-0 px-4 py-2 rounded-full text-xs font-bold transition-all bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 hover:border-slate-300">Curry Cuts</button>
                <button data-filter="prawns" class="filter-btn shrink-0 px-4 py-2 rounded-full text-xs font-bold transition-all bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 hover:border-slate-300">Prawns</button>
                <button data-filter="crabs" class="filter-btn shrink-0 px-4 py-2 rounded-full text-xs font-bold transition-all bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 hover:border-slate-300">Crabs</button>
            </div>
        </div>

        <!-- SECTION 1: LIVE INVENTORY - NEAT LIST VIEW -->
        <section>
            <div class="bg-brand-cardLight dark:bg-brand-cardDark rounded-2xl border border-slate-200 dark:border-slate-800/80 shadow-sm overflow-hidden">
                <div class="overflow-x-auto custom-scrollbar">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 dark:bg-slate-900/60 text-slate-400 dark:text-slate-400 text-xs font-bold uppercase tracking-wider border-b border-slate-200 dark:border-slate-800">
                                <th class="p-4 w-12 text-center">Status</th>
                                <th class="p-4">Fish Product Name</th>
                                <th class="p-4 text-right pr-6">Available Stock</th>
                            </tr>
                        </thead>
                        <tbody id="stockListBody" class="divide-y divide-slate-100 dark:divide-slate-800 text-sm">
                            <!-- Loading Skeleton Rows -->
                            <tr class="animate-pulse"><td class="p-4" colspan="3"><div class="h-5 bg-slate-200 dark:bg-slate-800 rounded"></div></td></tr>
                            <tr class="animate-pulse"><td class="p-4" colspan="3"><div class="h-5 bg-slate-200 dark:bg-slate-800 rounded"></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- SECTION 2: ANALYTICS & REPORTING -->
        <section class="border-t border-slate-200 dark:border-slate-800/80 pt-10">
            <div class="bg-brand-cardLight dark:bg-brand-cardDark rounded-3xl p-6 md:p-8 border border-slate-200/80 dark:border-slate-800/80 shadow-xl shadow-slate-200/40 dark:shadow-none">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-8">
                    <div>
                        <h2 class="text-3xl font-black tracking-tight text-slate-900 dark:text-white">TruSea Weekly Fish Sales Report</h2>
                        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Weekly enna fish evlov fish sales aachu kg wise tracking parameters</p>
                    </div>
                    <button id="downloadBtn" class="flex items-center justify-center gap-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold px-6 py-3.5 rounded-xl transition-all shadow-lg shadow-blue-500/20 active:scale-98 text-sm">
                        <i data-lucide="download" class="w-4 h-4"></i> Download Weekly Report
                    </button>
                </div>

                <div id="topSellerBadge" class="hidden items-center gap-4 bg-amber-500/10 border border-amber-500/20 p-4 rounded-2xl text-amber-700 dark:text-amber-400 mb-8">
                    <div class="bg-amber-500 text-white p-2 rounded-xl shadow-md"><i data-lucide="award" class="w-5 h-5"></i></div>
                    <div>
                        <p class="text-xs uppercase tracking-wider font-bold opacity-75">Top Selling Fish Product</p>
                        <span id="topSellerName" class="text-lg font-bold">Identifying metrics...</span>
                    </div>
                </div>

                <div class="overflow-x-auto custom-scrollbar border border-slate-100 dark:border-slate-800 rounded-2xl shadow-inner">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 dark:bg-slate-900/40 text-slate-500 dark:text-slate-400 text-xs font-bold uppercase tracking-wider border-b border-slate-100 dark:border-slate-800">
                                <th class="p-4">Time Interval</th>
                                <th class="p-4">Product Variant Description</th>
                                <th class="p-4 text-right">Quantity Sold Out (kg)</th>
                            </tr>
                        </thead>
                        <tbody id="salesTableBody" class="divide-y divide-slate-100 dark:divide-slate-800 text-sm"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbybZ66QUocgWFufPsZOqUYejy_slh32j3hNwGXfG9kfw5_njsgH6ZpAotdIy-Pn58Fj/exec";

        let serverPayload = { stock: [], sales: [] };
        let currentStatusTab = "instock"; 
        let currentCategoryFilter = "all";
        let searchQuery = "";

        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const stockListBody = document.getElementById('stockListBody');
        const salesTableBody = document.getElementById('salesTableBody');
        const topSellerBadge = document.getElementById('topSellerBadge');
        const topSellerName = document.getElementById('topSellerName');
        const downloadBtn = document.getElementById('downloadBtn');
        const searchInput = document.getElementById('searchInput');
        const tabInStock = document.getElementById('tabInStock');
        const tabSoldOut = document.getElementById('tabSoldOut');
        const filterBtns = document.querySelectorAll('.filter-btn');

        themeToggle.addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.replace('dark', 'light');
                localStorage.setItem('theme', 'light');
                themeIcon.setAttribute('data-lucide', 'moon');
            } else {
                document.documentElement.classList.replace('light', 'dark');
                localStorage.setItem('theme', 'dark');
                themeIcon.setAttribute('data-lucide', 'sun');
            }
            lucide.createIcons();
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                searchQuery = searchInput.value.trim().toLowerCase();
                renderStockMetrics();
            }
        });

        tabInStock.addEventListener('click', () => {
            currentStatusTab = "instock";
            tabInStock.className = "px-6 py-2.5 rounded-xl font-bold text-sm transition-all shadow-sm bg-white dark:bg-slate-800 text-blue-600 dark:text-white";
            tabSoldOut.className = "px-6 py-2.5 rounded-xl font-bold text-sm transition-all text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200";
            renderStockMetrics();
        });

        tabSoldOut.addEventListener('click', () => {
            currentStatusTab = "soldout";
            tabSoldOut.className = "px-6 py-2.5 rounded-xl font-bold text-sm transition-all shadow-sm bg-white dark:bg-slate-800 text-red-500 dark:text-white";
            tabInStock.className = "px-6 py-2.5 rounded-xl font-bold text-sm transition-all text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200";
            renderStockMetrics();
        });

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.className = "filter-btn shrink-0 px-4 py-2 rounded-full text-xs font-bold transition-all bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 hover:border-slate-300");
                btn.className = "filter-btn shrink-0 px-4 py-2 rounded-full text-xs font-bold transition-all bg-blue-600 text-white shadow-md shadow-blue-500/10";
                currentCategoryFilter = btn.getAttribute('data-filter');
                renderStockMetrics();
            });
        });

        async function fetchSpreadsheetContext() {
            try {
                const queryStream = await fetch(API_URL);
                serverPayload = await queryStream.json();
                renderStockMetrics();
                renderSalesMetrics();
            } catch (err) {
                console.error("Connection error with Google Spreadsheet:", err);
            }
        }

        function renderStockMetrics() {
            stockListBody.innerHTML = '';
            
            const filteredStock = serverPayload.stock.filter(fish => {
                const normalizedName = fish.name.toLowerCase();
                const normalizedStatus = fish.status.toLowerCase();
                const isItemOut = normalizedStatus.includes('out') || fish.kg <= 0;
                
                if (currentStatusTab === "instock" && isItemOut) return false;
                if (currentStatusTab === "soldout" && !isItemOut) return false;
                if (searchQuery && !normalizedName.includes(searchQuery)) return false;
                if (currentCategoryFilter !== "all" && !normalizedName.includes(currentCategoryFilter)) return false;

                return true;
            });

            if(filteredStock.length === 0) {
                stockListBody.innerHTML = `<tr><td colspan="3" class="p-8 text-center text-slate-400 font-medium">No matching items located.</td></tr>`;
                return;
            }

            filteredStock.forEach(fish => {
                const isOut = fish.kg <= 0 || fish.status.toLowerCase().includes('out');
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/80 dark:hover:bg-slate-900/40 transition-colors border-b border-slate-100 dark:border-slate-800/50";
                
                tr.innerHTML = `
                    <td class="p-4 text-center">
                        <span class="inline-block h-2.5 w-2.5 rounded-full ${isOut ? 'bg-red-500 shadow-md shadow-red-500/40' : 'bg-emerald-500 shadow-md shadow-emerald-500/40'}"></span>
                    </td>
                    <td class="p-4 font-semibold text-slate-700 dark:text-slate-200 tracking-tight">
                        ${fish.name}
                    </td>
                    <td class="p-4 text-right pr-6 font-mono font-bold ${isOut ? 'text-red-500 uppercase tracking-wide text-xs' : 'text-emerald-500'}">
                        ${isOut ? 'Sold Out' : `${fish.kg.toFixed(2)} kg`}
                    </td>
                `;
                stockListBody.appendChild(tr);
            });
        }

        function renderSalesMetrics() {
            salesTableBody.innerHTML = '';
            if (serverPayload.sales.length === 0) {
                salesTableBody.innerHTML = `<tr><td colspan="3" class="p-8 text-center text-slate-400 font-medium">No sales transactions logged matching rules.</td></tr>`;
                return;
            }

            let highestVolume = 0;
            let topProduct = "";
            serverPayload.sales.forEach(sale => {
                if (sale.kg > highestVolume) {
                    highestVolume = sale.kg;
                    topProduct = sale.name;
                }
            });

            if (topProduct) {
                topSellerName.innerText = `${topProduct} — ${highestVolume.toFixed(2)} kg Sold`;
                topSellerBadge.classList.replace('hidden', 'flex');
            }

            serverPayload.sales.forEach(row => {
                const isLeader = row.name === topProduct;
                const tr = document.createElement('tr');
                tr.className = `hover:bg-slate-50/60 dark:hover:bg-slate-800/30 transition-colors ${isLeader ? 'bg-amber-500/5 font-semibold text-amber-900 dark:text-amber-300' : ''}`;
                tr.innerHTML = `
                    <td class="p-4 text-slate-400 font-mono font-medium text-xs">${row.week}</td>
                    <td class="p-4 font-medium text-slate-800 dark:text-slate-200">
                        ${row.name} ${isLeader ? '👑' : ''}
                    </td>
                    <td class="p-4 text-right font-mono font-bold text-blue-600 dark:text-blue-400">${row.kg.toFixed(2)} kg</td>
                `;
                salesTableBody.appendChild(tr);
            });
        }

        downloadBtn.addEventListener('click', () => {
            let csvBody = "data:text/csv;charset=utf-8,";
            csvBody += "Time Interval,Product Description,Volume Sold Out (kg)\n";
            serverPayload.sales.forEach(row => {
                csvBody += `"${row.week}","${row.name}",${row.kg}\n`;
            });
            const URIStream = encodeURI(csvBody);
            const hiddenDownloadAnchor = document.createElement("a");
            hiddenDownloadAnchor.setAttribute("href", URIStream);
            hiddenDownloadAnchor.setAttribute("download", "TruSea_Weekly_Fish_Sales_Report.csv");
            document.body.appendChild(hiddenDownloadAnchor);
            hiddenDownloadAnchor.click();
            document.body.removeChild(hiddenDownloadAnchor);
        });

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'dark') {
                document.documentElement.classList.replace('light', 'dark');
                themeIcon.setAttribute('data-lucide', 'sun');
            } else {
                document.documentElement.classList.replace('dark', 'light');
                themeIcon.setAttribute('data-lucide', 'moon');
            }
            lucide.createIcons();
            fetchSpreadsheetContext();
            setInterval(fetchSpreadsheetContext, 25000);
        });
    </script>
</body>
</html>
